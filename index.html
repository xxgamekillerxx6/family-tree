<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'">
  <title>Family Tree</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Top bar with the main buttons -->
  <div id="toolbar">
    <button id="add-btn">+ Add person</button>
    <button id="list-btn">People list</button>
    <button id="export-btn">Export picture</button>
    <span class="hint">Drag empty space to move · Scroll to zoom · Double-click a card to edit ·
      Drag from dot to dot to connect · Click a line to delete it</span>
  </div>

  <!-- The grid. "world" holds the cards and lines and is moved/zoomed as one piece. -->
  <div id="viewport">
    <div id="world">
      <svg id="lines"></svg>
    </div>
  </div>

  <!-- Side panel with the list of people -->
  <div id="list-panel" hidden>
    <div class="panel-buttons">
      <button id="print-list-btn">Print list</button>
      <button id="close-list-btn">Close</button>
    </div>
    <h2>People</h2>
    <ol id="people-list"></ol>
  </div>

  <!-- Popup for editing a person -->
  <dialog id="editor">
    <form method="dialog">
      <h2>Edit person</h2>
      <div class="photo-row">
        <img id="photo-preview" alt="">
        <div>
          <input type="file" id="photo-input" accept="image/*">
          <button type="button" id="remove-photo-btn">Remove photo</button>
        </div>
      </div>
      <label>First name <input name="first"></label>
      <label>Last name <input name="last"></label>
      <label>Born (optional) <input name="birth" placeholder="e.g. 1950 or 12.03.1950"></label>
      <label>Died (optional) <input name="death"></label>
      <label>Description (optional) <textarea name="desc" rows="3"></textarea></label>
      <label>Arm color <input type="color" name="color"></label>
      <div class="dialog-buttons">
        <button value="delete" class="danger">Delete person</button>
        <button value="cancel">Cancel</button>
        <button value="save" class="primary">Save</button>
      </div>
    </form>
  </dialog>

  <script src="node_modules/html-to-image/dist/html-to-image.js"></script>
  <script src="app.js"></script>
</body>
</html>
